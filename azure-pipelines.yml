trigger:
- main

stages:
- stage: Build
  displayName: "Build Java App"
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'   # Microsoft-hosted agent
    steps:
    - checkout: self
    - task: Maven@3
      inputs:
        mavenPomFile: 'JtProject/pom.xml'
        goals: 'clean package'
        options: '-DskipTests'
        workingDirectory: 'JtProject'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'JtProject/target'
        artifact: 'drop'

- stage: Deploy
  displayName: "Deploy to Remote Server"
  dependsOn: Build
  jobs:
  - job: DeployJob
    pool:
      name: 'Java_Deployment'   # 👈 your self-hosted agent pool
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'drop'
        path: '$(Pipeline.Workspace)/drop'

    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: 'java_yaml'   # 👈 service connection with private IP
        sourceFolder: '$(Pipeline.Workspace)/drop'
        contents: '*.jar'
        targetFolder: '/home/itadmin/javaapp'

    - task: SSH@0
      inputs:
        sshEndpoint: 'java_yaml'
        runOptions: 'inline'
        inline: |
          cd /home/itadmin/javaapp
          pkill -f 'java -jar' || true
          nohup java -jar *.jar > app.log 2>&1 &
