trigger:
- main   # adjust branch name if needed

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: "Build Java App"
  jobs:
  - job: BuildJob
    steps:
    - checkout: self

    # Build with Maven (pom.xml inside JtProject)
    - task: Maven@3
      inputs:
        mavenPomFile: 'JtProject/pom.xml'
        goals: 'clean package'
        options: '-DskipTests'
        workingDirectory: 'JtProject'

    # Publish artifact (the JAR from JtProject/target)
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'JtProject/target'
        artifact: 'drop'

- stage: Deploy
  displayName: "Deploy to Linux Server"
  dependsOn: Build
  jobs:
  - job: DeployJob
    steps:
    # ✅ Download artifact FIRST
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: 'drop'
        path: '$(Pipeline.Workspace)/drop'

    # ✅ Then copy files over SSH
    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: 'Java_YAML'   # 👈 your service connection name
        sourceFolder: '$(Pipeline.Workspace)/drop'
        contents: '*.jar'
        targetFolder: '/home/itadmin/javaapp'

    # ✅ Finally run the app on the remote server
    - task: SSH@0
      inputs:
        sshEndpoint: 'Java_YAML'
        runOptions: 'inline'
        inline: |
          cd /home/itadmin/javaapp
          pkill -f 'java -jar' || true
          nohup java -jar *.jar > app.log 2>&1 &
