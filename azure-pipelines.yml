trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

# Build with Maven (point to JtProject/pom.xml)
- task: Maven@3
  inputs:
    mavenPomFile: 'JtProject/pom.xml'   # 👈 correct path
    goals: 'clean package'
    options: '-DskipTests'

# Publish artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'JtProject/target/*.jar'   # 👈 target folder inside JtProject
    ArtifactName: 'drop'
    publishLocation: 'Container'

# Copy artifact to remote Linux server
- task: CopyFilesOverSSH@0
  inputs:
    sshEndpoint: 'Java_YAML'   # 👈 your service connection name
    sourceFolder: '$(Pipeline.Workspace)/drop'
    contents: '*.jar'
    targetFolder: '/home/itadmin/javaapp'

# Run app on remote server
- task: SSH@0
  inputs:
    sshEndpoint: 'Java_YAML'
    runOptions: 'inline'
    inline: |
      cd /home/itadmin/javaapp
      nohup java -jar *.jar > app.log 2>&1 &
